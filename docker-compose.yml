version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0
    container_name: graphcode-neo4j
    ports:
      - "7474:7474" # Porta HTTP (para o Neo4j Browser)
      - "7687:7687" # Porta Bolt (para a tua app e o Neo4j Desktop)
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
